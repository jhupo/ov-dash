name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  build-backend:
    name: Build Backend
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum

      - name: Build api and worker
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist/ov-dash-${VERSION}-${{ matrix.suffix }}
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o ../dist/ov-dash-${VERSION}-${{ matrix.suffix }}/ov-dash-api${{ matrix.ext }} ./cmd/api
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o ../dist/ov-dash-${VERSION}-${{ matrix.suffix }}/ov-dash-worker${{ matrix.ext }} ./cmd/worker
          cp README.md ../dist/ov-dash-${VERSION}-${{ matrix.suffix }}/README-backend.md

      - name: Archive
        shell: bash
        run: |
          cd ../dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ov-dash-${{ github.ref_name }}-${{ matrix.suffix }}.zip ov-dash-${{ github.ref_name }}-${{ matrix.suffix }}
          else
            tar -czf ov-dash-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz ov-dash-${{ github.ref_name }}-${{ matrix.suffix }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ov-dash-${{ github.ref_name }}-${{ matrix.suffix }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  docker-images:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/docker/backend.Dockerfile
            image: ghcr.io/${{ github.repository }}-backend
          - name: frontend
            dockerfile: deploy/docker/frontend.Dockerfile
            image: ghcr.io/${{ github.repository }}-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
          build-args: |
            APP_VERSION=${{ github.ref_name }}

  release:
    name: Publish Release
    needs:
      - build-backend
      - docker-images
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
