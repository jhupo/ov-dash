name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  build-backend:
    name: Build Backend
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum

      - name: Build release archives
        shell: bash
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          targets=(
            "linux amd64 linux-amd64 "
            "linux arm64 linux-arm64 "
            "darwin amd64 darwin-amd64 "
            "darwin arm64 darwin-arm64 "
            "windows amd64 windows-amd64 .exe"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch suffix ext <<<"${target}"
            package="ov-dash-${VERSION}-${suffix}"
            mkdir -p "../dist/${package}"
            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "../dist/${package}/ov-dash-api${ext}" ./cmd/api
            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "../dist/${package}/ov-dash-worker${ext}" ./cmd/worker
            cp README.md "../dist/${package}/README-backend.md"
          done
          cd ../dist
          zip -r "ov-dash-${VERSION}-windows-amd64.zip" "ov-dash-${VERSION}-windows-amd64"
          tar -czf "ov-dash-${VERSION}-linux-amd64.tar.gz" "ov-dash-${VERSION}-linux-amd64"
          tar -czf "ov-dash-${VERSION}-linux-arm64.tar.gz" "ov-dash-${VERSION}-linux-arm64"
          tar -czf "ov-dash-${VERSION}-darwin-amd64.tar.gz" "ov-dash-${VERSION}-darwin-amd64"
          tar -czf "ov-dash-${VERSION}-darwin-arm64.tar.gz" "ov-dash-${VERSION}-darwin-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ov-dash-${{ github.ref_name }}-release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  docker-images:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/docker/backend.Dockerfile
            image: ghcr.io/${{ github.repository }}-backend
          - name: frontend
            dockerfile: deploy/docker/frontend.Dockerfile
            image: ghcr.io/${{ github.repository }}-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}

  release:
    name: Publish Release
    needs:
      - build-backend
      - docker-images
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: ov-dash-${{ github.ref_name }}-release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
