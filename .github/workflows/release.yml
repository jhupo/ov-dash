name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerequisite:
    name: CI Prerequisite
    uses: ./.github/workflows/ci.yml

  release-info:
    name: Validate Release Tag
    needs: prerequisite
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          validate_release_version() {
            local value="$1" prerelease identifier
            [[ "${value}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || return 1
            if [[ "${value}" == *-* ]]; then
              prerelease="${value#*-}"
              IFS='.' read -ra identifiers <<<"${prerelease}"
              for identifier in "${identifiers[@]}"; do
                if [[ "${identifier}" =~ ^[0-9]+$ && "${identifier}" != "0" && "${identifier}" == 0* ]]; then
                  return 1
                fi
              done
            fi
          }

          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]] || ! validate_release_version "${VERSION}"; then
            echo "release tag must be strict SemVer without numeric prerelease leading zeros" >&2
            exit 1
          fi

          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"

  release-assets:
    name: Build Release Assets
    needs: release-info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build application packages
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
          RELEASE_SEQUENCE: ${{ github.run_number }}
          CONFIGURED_MINIMUM_VERSION: ${{ vars.UPDATE_MINIMUM_VERSION }}
          CONFIGURED_MINIMUM_SCHEMA: ${{ vars.UPDATE_MINIMUM_SCHEMA }}
        run: |
          set -euo pipefail

          DIST_DIR="${GITHUB_WORKSPACE}/dist"
          STAGING_DIR="${DIST_DIR}/staging"
          RELEASE_ID="ov-dash-${RELEASE_VERSION}"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          MINIMUM_VERSION="${CONFIGURED_MINIMUM_VERSION:-0.0.0}"
          FROM_SCHEMA="${CONFIGURED_MINIMUM_SCHEMA:-0}"
          TO_SCHEMA="$(
            find backend/migrations -maxdepth 1 -type f -printf '%f\n' \
              | sed -nE 's/^([0-9]+)_.*\.sql$/\1/p' \
              | sort -n \
              | tail -n 1 \
              | sed -E 's/^0+//'
          )"
          TO_SCHEMA="${TO_SCHEMA:-0}"

          validate_release_version() {
            local value="$1" prerelease identifier
            [[ "${value}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || return 1
            if [[ "${value}" == *-* ]]; then
              prerelease="${value#*-}"
              IFS='.' read -ra identifiers <<<"${prerelease}"
              for identifier in "${identifiers[@]}"; do
                if [[ "${identifier}" =~ ^[0-9]+$ && "${identifier}" != "0" && "${identifier}" == 0* ]]; then
                  return 1
                fi
              done
            fi
          }

          validate_release_version "${MINIMUM_VERSION}" || {
            echo "UPDATE_MINIMUM_VERSION must be strict SemVer" >&2
            exit 1
          }
          [[ "${FROM_SCHEMA}" =~ ^(0|[1-9][0-9]*)$ ]] || {
            echo "UPDATE_MINIMUM_SCHEMA must be a non-negative integer" >&2
            exit 1
          }
          (( FROM_SCHEMA <= TO_SCHEMA )) || {
            echo "UPDATE_MINIMUM_SCHEMA cannot exceed the release schema" >&2
            exit 1
          }

          mkdir -p "${STAGING_DIR}"

          DIST_DIR="${DIST_DIR}" \
          RELEASE_ID="${RELEASE_ID}" \
          PUBLISHED_AT="${PUBLISHED_AT}" \
          MINIMUM_VERSION="${MINIMUM_VERSION}" \
          FROM_SCHEMA="${FROM_SCHEMA}" \
          TO_SCHEMA="${TO_SCHEMA}" \
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const artifact = (arch) => {
            const filename = `ov-dash_${process.env.RELEASE_VERSION}_linux_${arch}.tar.gz`
            return {
              filename,
              checksum_filename: `${filename}.sha256`,
              signature_filename: `${filename}.sha256.sig`,
            }
          }

          const release = {
            schema_version: 1,
            release_id: process.env.RELEASE_ID,
            version: process.env.RELEASE_VERSION,
            sequence: Number(process.env.RELEASE_SEQUENCE),
            published_at: process.env.PUBLISHED_AT,
            minimum_version: process.env.MINIMUM_VERSION,
            database: {
              from_schema: Number(process.env.FROM_SCHEMA),
              to_schema: Number(process.env.TO_SCHEMA),
            },
            artifacts: {
              linux_amd64: artifact('amd64'),
              linux_arm64: artifact('arm64'),
            },
          }

          fs.writeFileSync(
            path.join(process.env.DIST_DIR, 'release.json'),
            `${JSON.stringify(release, null, 2)}\n`,
          )
          NODE

          for arch in amd64 arm64; do
            asset="ov-dash_${RELEASE_VERSION}_linux_${arch}"
            package_root="${STAGING_DIR}/${asset}"
            mkdir -p "${package_root}/bin" "${package_root}/web" "${package_root}/migrations"

            (
              cd backend
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
                go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_VERSION}" \
                -o "${package_root}/bin/app" ./cmd/app
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
                go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_VERSION}" \
                -o "${package_root}/bin/migrate" ./cmd/migrate
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
                go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_VERSION}" \
                -o "${package_root}/bin/bootstrap-admin" ./cmd/bootstrap-admin
            )

            cp -a frontend/dist/. "${package_root}/web/"
            cp -a backend/migrations/. "${package_root}/migrations/"

            PACKAGE_ROOT="${package_root}" \
            TARGET_ARCH="${arch}" \
            RELEASE_PATH="${DIST_DIR}/release.json" \
            node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_PATH, 'utf8'))
          const manifest = { ...release, architecture: process.env.TARGET_ARCH }

          fs.writeFileSync(
            path.join(process.env.PACKAGE_ROOT, 'manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`,
          )
          NODE

            tar -C "${package_root}" -czf "${DIST_DIR}/${asset}.tar.gz" .
          done

          cd "${DIST_DIR}"
          for archive in ov-dash_*_linux_*.tar.gz; do
            sha256sum "${archive}" > "${archive}.sha256"
          done

      - name: Sign release metadata and package checksums
        shell: bash
        env:
          RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_ED25519_PRIVATE_KEY}"

          node <<'NODE'
          const crypto = require('crypto')
          const fs = require('fs')
          const path = require('path')

          const secret = process.env.RELEASE_ED25519_PRIVATE_KEY.trim()
          let keyData = secret
          let keyOptions
          if (!secret.includes('-----BEGIN')) {
            const decoded = Buffer.from(secret, 'base64')
            if (decoded.toString('utf8').includes('-----BEGIN')) {
              keyData = decoded
            } else {
              keyOptions = { key: decoded, format: 'der', type: 'pkcs8' }
            }
          }

          const privateKey = crypto.createPrivateKey(keyOptions ?? keyData)
          if (privateKey.asymmetricKeyType !== 'ed25519') {
            throw new Error('RELEASE_ED25519_PRIVATE_KEY is not an Ed25519 private key')
          }

          const checksumFiles = fs.readdirSync('dist')
            .filter((name) => name.endsWith('.tar.gz.sha256'))
            .sort()
          if (checksumFiles.length !== 2) {
            throw new Error(`expected two package checksums, found ${checksumFiles.length}`)
          }

          for (const name of [...checksumFiles, 'release.json']) {
            const sourcePath = path.join('dist', name)
            const signature = crypto.sign(null, fs.readFileSync(sourcePath), privateKey)
            if (signature.length !== 64) {
              throw new Error(`unexpected Ed25519 signature size for ${name}`)
            }
            fs.writeFileSync(`${sourcePath}.sig`, `${signature.toString('base64')}\n`)
          }
          NODE

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ov-dash-${{ github.ref_name }}-release-assets
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sha256.sig
            dist/release.json
            dist/release.json.sig
          if-no-files-found: error
          retention-days: 7

  runtime-image:
    name: Build Runtime Image
    needs: release-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-runtime:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-runtime:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ needs.release-info.outputs.version }}

  release:
    name: Publish GitHub Release
    needs:
      - release-assets
      - runtime-image
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: ov-dash-${{ github.ref_name }}-release-assets
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sha256.sig
            dist/release.json
            dist/release.json.sig
          generate_release_notes: true
          fail_on_unmatched_files: true
