name: ov-dash

x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-ov-dash}
  APP_ENV: ${APP_ENV:-production}
  APP_VERSION: ${APP_VERSION:-local}
  APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-15s}
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: 8080
  HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://localhost,http://192.168.2.17}
  APP_SECRET_ACTIVE_KEY_ID: ${APP_SECRET_ACTIVE_KEY_ID:-local}
  APP_SECRET_KEYS_JSON: '${APP_SECRET_KEYS_JSON:-{"local":"local-development-secret-change-me"}}'
  UPDATE_SOCKET_PATH: ${UPDATE_SOCKET_PATH:-/run/ov-dash/updater.sock}
  MIGRATIONS_DIR: /migrations
  POSTGRES_DSN: postgres://${POSTGRES_USER:-ov_dash}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-ov_dash}?sslmode=disable
  POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-20}
  POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-2}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PREFIX: ${REDIS_PREFIX:-ov-dash}
  WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-jobs:default}
  WORKER_JOB_TIMEOUT: ${WORKER_JOB_TIMEOUT:-5m}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  WORKER_RESCUE_AFTER: ${WORKER_RESCUE_AFTER:-15m}
  TZ: ${TZ:-Asia/Shanghai}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,api,worker,frontend}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ov_dash}
      POSTGRES_USER: ${POSTGRES_USER:-ov_dash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ov_dash

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ov_dash

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/jhupo/ov-dash-backend:0.1.0}
    command: ["/app/migrate"]
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ov_dash

  bootstrap-admin:
    image: ${BACKEND_IMAGE:-ghcr.io/jhupo/ov-dash-backend:0.1.0}
    command: ["/app/bootstrap-admin"]
    profiles: ["tools"]
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ov_dash

  api:
    image: ${BACKEND_IMAGE:-ghcr.io/jhupo/ov-dash-backend:0.1.0}
    command: ["/app/api"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    stop_grace_period: 45s
    volumes:
      - type: bind
        source: /run/ov-dash
        target: /run/ov-dash
        read_only: true
    group_add:
      - "${UPDATE_SOCKET_GID:-1000}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ov_dash

  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/jhupo/ov-dash-backend:0.1.0}
    command: ["/app/worker"]
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ov_dash

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/jhupo/ov-dash-frontend:0.1.0}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ov_dash

volumes:
  postgres_data:
  redis_data:

networks:
  ov_dash:
    driver: bridge
