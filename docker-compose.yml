name: ov-dash

x-backend-build: &backend-build
  context: .
  dockerfile: deploy/docker/backend.Dockerfile
  args:
    GO_VERSION: ${GO_VERSION:-1.23}
    GO_IMAGE: ${GO_IMAGE:-docker.1ms.run/library/golang:1.23-alpine}
    RUNTIME_IMAGE: ${RUNTIME_IMAGE:-docker.m.daocloud.io/library/alpine:3.20}
    GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    APP_VERSION: ${APP_VERSION:-local}

x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-ov-dash}
  APP_ENV: ${APP_ENV:-production}
  APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-15s}
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: 8080
  HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://localhost,http://192.168.2.17}
  POSTGRES_DSN: postgres://${POSTGRES_USER:-ov_dash}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-ov_dash}?sslmode=disable
  POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-20}
  POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-2}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PREFIX: ${REDIS_PREFIX:-ov-dash}
  WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-jobs:default}
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
  WORKER_JOB_TIMEOUT: ${WORKER_JOB_TIMEOUT:-5m}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  WORKER_VISIBILITY_LEASE: ${WORKER_VISIBILITY_LEASE:-10m}
  PYTHON_BIN: python3
  PYTHON_SCRIPTS_DIR: /app/scripts
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ov_dash}
      POSTGRES_USER: ${POSTGRES_USER:-ov_dash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ov_dash

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ov_dash

  api:
    image: ov-dash-backend:${APP_VERSION:-local}
    build: *backend-build
    command: ["/app/api"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ov_dash

  worker:
    image: ov-dash-backend:${APP_VERSION:-local}
    build: *backend-build
    command: ["/app/worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ov_dash

  frontend:
    image: ov-dash-frontend:${APP_VERSION:-local}
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.1ms.run/library/nginx:1.27-alpine}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_ENABLE_DEVTOOLS: ${VITE_ENABLE_DEVTOOLS:-false}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ov_dash

volumes:
  postgres_data:
  redis_data:

networks:
  ov_dash:
    driver: bridge
