name: ov-dash

x-app-build: &app-build
  context: .
  dockerfile: deploy/docker/backend.Dockerfile
  args:
    GO_VERSION: ${GO_VERSION:-1.23}
    GO_IMAGE: ${GO_IMAGE:-golang:1.23-alpine}
    NODE_VERSION: ${NODE_VERSION:-22}
    NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.20}
    APK_REPOSITORY: ${APK_REPOSITORY:-https://mirrors.aliyun.com/alpine}
    GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
    APP_VERSION: ${APP_VERSION:-local}
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    ALL_PROXY: ${ALL_PROXY:-}
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,redis,app}

services:
  app:
    image: ${APP_IMAGE:-ov-dash-runtime:local}
    build: *app-build

  bootstrap-admin:
    image: ${APP_IMAGE:-ov-dash-runtime:local}
